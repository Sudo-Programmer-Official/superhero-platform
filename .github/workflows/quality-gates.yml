name: Quality Gates

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  deploy-env-preflight:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate API production env contract
        env:
          ENV: production
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.RENDER_DATABASE_URL_SYNC }}
          DB_SCHEMA: ${{ secrets.RENDER_DB_SCHEMA }}
          CORS_ORIGINS: ${{ secrets.RENDER_CORS_ORIGINS }}
          FIREBASE_PROJECT_ID: ${{ secrets.RENDER_FIREBASE_PROJECT_ID }}
          AWS_REGION: ${{ secrets.RENDER_AWS_REGION }}
          S3_BUCKET: ${{ secrets.RENDER_S3_BUCKET }}
          S3_PREFIX: ${{ secrets.RENDER_S3_PREFIX }}
          LOG_LEVEL: ${{ secrets.RENDER_LOG_LEVEL }}
          LOG_FORMAT: ${{ secrets.RENDER_LOG_FORMAT }}
          PAYMENTS_TEST_MODE: ${{ secrets.RENDER_PAYMENTS_TEST_MODE }}
          STRIPE_SECRET_KEY: ${{ secrets.RENDER_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.RENDER_STRIPE_WEBHOOK_SECRET }}
        run: bash ./scripts/validate-env.sh api
      - name: Validate web production env contract
        env:
          VITE_API_URL: ${{ secrets.VERCEL_VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VERCEL_VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VERCEL_VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VERCEL_VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VERCEL_VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VERCEL_VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VERCEL_VITE_FIREBASE_APP_ID }}
        run: bash ./scripts/validate-env.sh web

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
      - name: Run API tests
        env:
          ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/superhero_platform
          DB_SCHEMA: superhero_platform
          CORS_ORIGINS: http://localhost:5173,http://localhost:5174
          FIREBASE_PROJECT_ID: test-project
          AWS_REGION: us-east-1
          S3_BUCKET: test-bucket
          S3_PREFIX: superhero-platform/test
          PAYMENTS_TEST_MODE: "true"
          STARTUP_VALIDATION_STRICT: "false"
        run: cd apps/api && pytest -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm build:web
      - name: Run web smoke tests
        run: pnpm test:web:smoke
